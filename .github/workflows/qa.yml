name: QA

# PR과 main push마다 기존 테스트를 자동으로 돌린다.
# 버스 API 키·서버 접속 정보는 쓰지 않는다. 목업·저장된 자료만 사용한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ML + 백엔드 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            hanjari-web/backend/requirements.txt
      - name: 운영과 같은 버전으로 설치
        run: python -m pip install -r requirements-runtime.txt
      - name: ML 테스트
        working-directory: hanjari-ml
        run: python -m unittest discover -s tests -v
      - name: 백엔드 테스트
        working-directory: hanjari-web/backend
        run: python -m unittest discover -s . -p "test_*.py" -v

  frontend:
    name: 프론트 린트·빌드·Playwright(목업)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hanjari-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hanjari-web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: Playwright 테스트
        run: npm test
        env:
          VITE_MOCK: "1"
      - name: 실패 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hanjari-web/frontend/playwright-report
          retention-days: 7
