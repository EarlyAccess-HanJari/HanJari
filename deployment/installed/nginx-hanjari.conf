server {
    listen 80;
    server_name 161.33.132.80;
    location /.well-known/acme-challenge/ { root /var/lib/hanjari-acme; }
    location / { return 308 https://161.33.132.80$request_uri; }
}
server {
    listen 443 ssl;
    server_name 161.33.132.80;
    ssl_certificate /etc/letsencrypt/live/hanjari-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanjari-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
}
