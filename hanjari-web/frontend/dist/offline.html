<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F1F4F8" />
  <title>한자리 · 인터넷 연결 확인</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F1F4F8; color: #111B2E; font-family: -apple-system, "Malgun Gothic", sans-serif; line-height: 1.6; }
    main { max-width: 440px; margin: 12vh auto; padding: 28px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 24px; margin: 24px 0 12px; }
    p { color: #536075; }
    a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; background: #1D4F91; color: white; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="한자리" />
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>실시간 버스 정보는 인터넷 연결이 필요해요.<br />연결 후 최신 도착 시간과 현재 차내 추정 인원을 다시 확인해 주세요.</p>
    <a href="/">다시 연결하기</a>
  </main>
  <script>
    let checking = false;
    async function reconnect() {
      if (!navigator.onLine || checking) return;
      checking = true;
      try {
        const response = await fetch("/api/health", { cache: "no-store", signal: AbortSignal.timeout(5000) });
        if (response.ok) location.replace("/");
      } catch { /* The connection may not be ready when the online event fires. */ }
      finally { checking = false; }
    }
    window.addEventListener("online", reconnect);
    // Navigation can miss the online event; retry only while the browser reports a connection.
    setInterval(reconnect, 3000);
    reconnect();
  </script>
</body>
</html>
